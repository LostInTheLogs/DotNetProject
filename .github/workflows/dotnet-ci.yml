name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore -p:AllowMissingPrunePackageData=true
      
    - name: Build
      run: dotnet build --no-restore -c Release -p:AllowMissingPrunePackageData=true
      
    - name: Test
      run: dotnet test --no-build -c Release -p:AllowMissingPrunePackageData=true
